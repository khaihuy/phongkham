name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  lint-typecheck-test:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test -- --run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phongkham
          POSTGRES_PASSWORD: phongkham123
          POSTGRES_DB: phongkham_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phongkham -d phongkham_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://phongkham:phongkham123@localhost:5432/phongkham_db
      NEXTAUTH_SECRET: ci-secret-32-characters-minimum-length-ok
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Prisma schema (build needs DB connection)
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Build
        run: npm run build
